    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.35 + Math.random() * 0.3;
    const lfoG = audioCtx.createGain();
    lfoG.gain.value = S.disSpeed * 0.004;
    lfo.connect(lfoG).connect(src.playbackRate);
    lfo.start();
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 8000;
    lp.Q.value = 0.4;
    const dropG = audioCtx.createGain(); // flake ducking
    const g = audioCtx.createGain();
    g.gain.value = 0; // the loop drifts in over ~10s
    src.connect(lp).connect(dropG).connect(g).connect(disintBus);
    src.start();

    scenes.disint.items.push({
      buffer,
      vol: 1,
      loopDur: loopBuf._loopEnd,
      bornAt: audioCtx.currentTime,
      src, lfo, lfoG, lp, dropG, g,
      hue: HUES[hueIdx++ % HUES.length],
      wear: 0,
      pos: 0,
      angle: 0,
      gaps: [],       // {a: angle on loop, w: width rad, depth}
      dying: false,
      dieAt: 0,
    });
  }

  function killDisintLoop(v) {
    try { v.src.stop(); v.lfo.stop(); } catch (e) {}
    try {
      v.src.disconnect(); v.lfo.disconnect(); v.lfoG.disconnect();
      v.lp.disconnect(); v.dropG.disconnect(); v.g.disconnect();
    } catch (e) {}
  }

  function gapDepthAt(v, ang) {
    let depth = 0;
    for (const gp of v.gaps) {
      const d = Math.abs(((ang - gp.a) + Math.PI * 3) % (Math.PI * 2) - Math.PI);
      if (d < gp.w / 2) depth = Math.max(depth, gp.depth);
    }
    return depth;
  }

  function stepDisint(dt) {
    if (!audioCtx) return;
    const ta = audioCtx.currentTime;
    const sc = scenes.disint;
    for (let i = sc.items.length - 1; i >= 0; i--) {
      const v = sc.items[i];
      v.src.playbackRate.value = S.disSpeed;
      v.lfoG.gain.value = S.disSpeed * (0.004 + v.wear * 0.012); // wow deepens with age
      v.pos += dt * S.disSpeed;
      v.angle = (v.pos % v.loopDur) / v.loopDur * Math.PI * 2;

      // pendant mode (Huerco S.): decay pauses, hypnotic multi-minute arcs instead
      if (S.disPendant && !v.dying) {
        const t2 = performance.now() / 1000;
        const ph = v.bornAt * 7.3;
        v.lp.frequency.setTargetAtTime(2500 + 4500 * (0.5 + 0.5 * Math.sin(t2 * 0.011 + ph)), ta, 0.5);
        v.lfoG.gain.value = S.disSpeed * (0.004 + 0.01 * (0.5 + 0.5 * Math.sin(t2 * 0.017 + ph * 2)));
        const duckP = 1 - gapDepthAt(v, v.angle);
        v.dropG.gain.setTargetAtTime(duckP, ta, 0.015);
        const fadeInP = Math.min(1, (ta - v.bornAt) / 10);
        v.g.gain.setTargetAtTime(0.9 * (1 - v.wear * 0.75) * fadeInP * v.vol, ta, 0.3);
        continue;
      }

      if (!v.dying) {
        v.wear = Math.min(1, v.wear + dt / (S.disLife * 60));
        // new flakes appear, more often as the tape ages
        if (v.gaps.length < 120 && Math.random() < dt * (0.03 + v.wear * 0.6)) {
          v.gaps.push({
            a: Math.random() * Math.PI * 2,
            w: 0.03 + Math.random() * 0.08,
            depth: 0.25 + Math.random() * 0.35,
          });
          if (Math.random() < 0.15) logEvent('the tape lost another flake');
        }
        // every existing flake keeps wearing: wider, deeper. irreversible.
        for (const gp of v.gaps) {
          gp.w = Math.min(1.2, gp.w + dt * 0.002 * (1 + v.wear * 3));
          gp.depth = Math.min(1, gp.depth + dt * 0.0035 * (1 + v.wear * 2));
        }
        if (v.wear >= 1) { v.dying = true; v.dieAt = performance.now() + 6000; }
      }

      // the sound ducks exactly where the tape is flaked
      const duck = 1 - gapDepthAt(v, v.angle);
      v.dropG.gain.setTargetAtTime(duck, ta, 0.015);
      v.lp.frequency.setTargetAtTime(600 + 7400 * Math.pow(1 - v.wear, 2), ta, 0.3);
      const fadeIn = Math.min(1, (ta - v.bornAt) / 10); // gradual first entrance
      v.g.gain.setTargetAtTime(v.dying ? 0 : 0.9 * (1 - v.wear * 0.75) * fadeIn * v.vol, ta, v.dying ? 1.5 : 0.3);

      if (v.dying && performance.now() > v.dieAt) {
        killDisintLoop(v);
        sc.items.splice(i, 1);
        logEvent('a loop finished its life');
        if (activeTab === 'disint') { updateCount(); updateHint(); }
      }
    }
  }

  function drawDisint() {
    const W = canvas.clientWidth, H = canvas.clientHeight;
    const cx = W / 2, cy = H / 2;
    scenes.disint.items.forEach((v, idx) => {
      const R = Math.min(W, H) * (0.14 + idx * 0.055);
      const SEG = 140;
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      for (let s = 0; s < SEG; s++) {
        const a0 = s / SEG * Math.PI * 2;
        const depth = gapDepthAt(v, a0);
        if (depth > 0.85) continue; // flaked off entirely
        const alpha = (0.7 - v.wear * 0.4) * (1 - depth * 0.8);
        ctx.beginPath();
        ctx.arc(cx, cy, R, a0, a0 + (Math.PI * 2 / SEG) * 0.8);
        ctx.strokeStyle = `hsla(${v.hue}, ${60 - v.wear * 35}%, ${55 - v.wear * 15}%, ${alpha})`;
        ctx.stroke();
      }
      // playhead
      const px = cx + Math.cos(v.angle) * R;
      const py = cy + Math.sin(v.angle) * R;
      ctx.beginPath();
      ctx.arc(px, py, 5, 0, Math.PI * 2);
      ctx.fillStyle = `hsl(${v.hue}, 70%, ${70 - v.wear * 25}%)`;
      ctx.fill();
    });
  }

  // ---------- RHYTHM machine (soft modular, generative but bounded) ----------
  function euclid(k, n, rot) {
    const p = [];
    let bucket = 0;
    for (let i = 0; i < n; i++) {
      bucket += k;
      if (bucket >= n) { bucket -= n; p.push(1); } else p.push(0);
    }
    return p.map((_, i) => p[(i - rot + n * 2) % n]);
  }

  // cut a slice, apply soft attack + exp decay, normalize gently
  function makeSlice(buffer, startSample, lenSamples) {
    const rate = buffer.sampleRate;
    const len = Math.max(Math.floor(rate * 0.03), Math.min(lenSamples, buffer.length - startSample));
    const out = audioCtx.createBuffer(buffer.numberOfChannels, len, rate);
    const att = Math.floor(rate * 0.004);
    let peak = 0;
    for (let c = 0; c < buffer.numberOfChannels; c++) {
      const src = buffer.getChannelData(c);
      const dst = out.getChannelData(c);
      for (let i = 0; i < len; i++) {
        const env = Math.min(1, i / att) * Math.pow(1 - i / len, 1.6);
        dst[i] = src[startSample + i] * env;
        peak = Math.max(peak, Math.abs(dst[i]));
      }
    }
    if (peak > 0.001) {
      const norm = 0.85 / peak;
      for (let c = 0; c < buffer.numberOfChannels; c++) {
        const dst = out.getChannelData(c);
        for (let i = 0; i < len; i++) dst[i] *= norm;
      }
    }
    return out;
  }

  // one recording -> 3-piece kit: loudest bit (kick), brightest (hat), mid (snare)
  function analyzeKit(buffer) {
    const rate = buffer.sampleRate;
    const data = buffer.getChannelData(0);
    if (buffer.duration < 0.3) {
      // short tap: same slice at three speeds
      const whole = buffer.length;
      return [
        { buf: makeSlice(buffer, 0, whole), rate: 0.6 },
        { buf: makeSlice(buffer, 0, whole), rate: 1 },
        { buf: makeSlice(buffer, 0, whole), rate: 1.7 },
      ];
    }
    const win = 1024, hop = 512;
    const frames = [];
    for (let s = 0; s + win < data.length; s += hop) {
      let e = 0, zc = 0;
      for (let i = 0; i < win; i++) {
        e += data[s + i] * data[s + i];
        if (i && (data[s + i] >= 0) !== (data[s + i - 1] >= 0)) zc++;
      }
      frames.push({ s, e, zc });
    }
    const maxE = Math.max(...frames.map(f => f.e)) || 1;
    const kickF = frames.reduce((a, b) => (b.e > a.e ? b : a));
    const hatF = frames.reduce((a, b) =>
      ((b.zc * Math.pow(b.e / maxE, 0.3)) > (a.zc * Math.pow(a.e / maxE, 0.3)) && b.e > maxE * 0.05 ? b : a));
    const guard = rate * 0.1;
    const snareCand = frames.filter(f => Math.abs(f.s - kickF.s) > guard);
    const snareF = snareCand.length
      ? snareCand.reduce((a, b) => (b.e > a.e ? b : a))
      : kickF;
    const at = f => Math.max(0, f.s - Math.floor(rate * 0.005));
    return [
      { buf: makeSlice(buffer, at(kickF), Math.floor(rate * 0.2)), rate: 1 },
      { buf: makeSlice(buffer, at(snareF), Math.floor(rate * 0.15)), rate: 1 },
      { buf: makeSlice(buffer, at(hatF), Math.floor(rate * 0.08)), rate: 1 },
    ];
  }

  function spawnRhythmKit({ buffer }) {
    const slices = analyzeKit(buffer);
    const mkVoice = (sliceIdx, len, k, rot) => ({
      sliceIdx, len,
      base: euclid(k, len, rot),
      pattern: euclid(k, len, rot),
      step: 0,
    });
    scenes.rhythm.items.push({
      buffer,
      vol: 1,
      slices,
      hue: HUES[hueIdx++ % HUES.length],
      voices: [
        mkVoice(0, 16, 3 + Math.floor(Math.random() * 3), 0),                       // kick
        mkVoice(1, 16, 2 + Math.floor(Math.random() * 2), 4),                       // snare
        mkVoice(2, Math.random() < 0.4 ? 12 : 16, 5 + Math.floor(Math.random() * 4), Math.floor(Math.random() * 4)), // hat
      ],
    });
  }

  // bounded mutation: flips drift the pattern, healing pulls it home. never chaos.
  function mutateVoice(v, isKick) {
    if (Math.random() < S.rhyMut * WX.mut) {
      const i = 1 + Math.floor(Math.random() * (v.len - 1)); // step 0 is sacred on every voice
      if (!(isKick && i === 0)) v.pattern[i] = 1 - v.pattern[i];
    }
    const diffs = [];
    for (let i = 0; i < v.len; i++) if (v.pattern[i] !== v.base[i]) diffs.push(i);
    if (diffs.length > 3 || (diffs.length && Math.random() < 0.25)) {
      const i = diffs[Math.floor(Math.random() * diffs.length)];
      v.pattern[i] = v.base[i]; // heal back toward the original groove
    }
  }

  function rhythmKitCenter(idx, count) {
    const W = canvas.clientWidth, H = canvas.clientHeight;
    return { x: W * (idx + 1) / (count + 1), y: H / 2 };
  }

  function playSlice(kit, voice, when, vel) {
    if (muted) return;
    noteSoundStart();
    const slice = kit.slices[voice.sliceIdx];
    const src = audioCtx.createBufferSource();
    src.buffer = slice.buf;
    src.playbackRate.value = slice.rate
      * (voice.sliceIdx === 0 && Math.random() < 0.12 ? 0.5 : 1)  // soft half-pitch thump
      * Math.pow(2, (Math.random() * 20 - 10) / 1200);
    const g = audioCtx.createGain();
    g.gain.value = vel * kit.vol;
    src.connect(g).connect(rhythmBus);
    src.start(when);
  }

  let rhyNext = 0;
  let rhyGlobalStep = 0;

  function stepRhythm(dt) {
    const items = scenes.rhythm.items;
    if (!audioCtx || !items.length) { rhyNext = 0; return; }
    const ta = audioCtx.currentTime;
    if (!rhyNext || rhyNext < ta - 0.5) rhyNext = ta + 0.05;
    while (rhyNext < ta + 0.15) {
      const stepDur = 60 / S.rhyBpm / 4;
      const swingOff = (rhyGlobalStep % 2 === 1) ? (S.rhySwing - 0.5) * stepDur * 2 : 0;
      items.forEach((kit, ki) => {
        kit.voices.forEach((v, vi) => {
          const idx = v.step % v.len;
          const hit = v.pattern[idx] === 1;
          const when = rhyNext + swingOff + (Math.random() - 0.5) * 0.008;
          let vel = 0;
          if (hit && Math.random() < Math.min(1, S.rhyDensity)) {
            vel = (vi === 0 ? 0.85 : vi === 1 ? 0.7 : 0.5) * (0.85 + Math.random() * 0.3);
          } else if (!hit && Math.random() < 0.04 * S.rhyDensity + Math.max(0, S.rhyDensity - 1) * 0.12) {
            vel = 0.15 + Math.random() * 0.08; // ghost note
          }
          if (vel > 0) {
            playSlice(kit, v, when, vel);
            const c = rhythmKitCenter(ki, items.length);
            const R = Math.min(canvas.clientWidth, canvas.clientHeight) * (0.09 + vi * 0.045);
            const a = idx / v.len * Math.PI * 2 - Math.PI / 2;
            scenes.rhythm.ripples.push({
              x: c.x + Math.cos(a) * R, y: c.y + Math.sin(a) * R,
              r: 4, maxR: 6 + vel * 22, a: 0.35 + vel * 0.4, hue: kit.hue,
            });
          }
          v.step++;
          if (v.step % v.len === 0) mutateVoice(v, vi === 0);
        });
      });
      rhyGlobalStep++;
      rhyNext += stepDur;
    }
    // warmth filter follows the knob with a slow organic wobble
    if (rhyLp) {
      const t = performance.now() / 1000;
      const target = (8500 - S.rhyWarm * 6000) * (1 + 0.08 * Math.sin(t * 0.05));
      rhyLp.frequency.setTargetAtTime(target, ta, 0.5);
    }
  }

  function drawRhythm() {
    const items = scenes.rhythm.items;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    items.forEach((kit, ki) => {
      const c = rhythmKitCenter(ki, items.length);
      kit.voices.forEach((v, vi) => {
        const R = Math.min(W, H) * (0.09 + vi * 0.045);
        const cur = v.step % v.len;
        for (let i = 0; i < v.len; i++) {
          const a = i / v.len * Math.PI * 2 - Math.PI / 2;
          const x = c.x + Math.cos(a) * R;
          const y = c.y + Math.sin(a) * R;
          const on = v.pattern[i] === 1;
          const isCur = i === cur;
          ctx.beginPath();
          ctx.arc(x, y, on ? (isCur ? 5.5 : 4) : 2, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${kit.hue}, ${on ? 70 : 30}%, ${on ? (isCur ? 72 : 55) : 42}%, ${on ? 0.9 : 0.35})`;
          ctx.fill();
        }
      });
    });
  }

  // ---------- DAYDREAM visuals (single-pass WebGL: gradient blobs -> turbulent
  // displace -> lens warp -> glow; half-res render = free box blur) ----------
  const DREAM_LENS = 0.55;  // barrel warp amount (CC Lens)
  const DREAM_GLOW = 0.45;  // glow lift
  let glCanvas = null, gl = null, glProg = null, glLoc = null;

  function hueToRgb(h) {
    const f = n => {
      const k = (n + h / 30) % 12;
      return 0.55 - 0.38 * Math.max(-1, Math.min(1, Math.min(k - 3, 9 - k)));
    };
    return [f(0), f(8), f(4)];
  }

  function initDreamGL() {
    if (gl !== null) return gl;
    glCanvas = document.getElementById('glstage');
    gl = glCanvas.getContext('webgl', { alpha: true, premultipliedAlpha: false }) || false;
    if (!gl) return gl;
    const vs = `attribute vec2 aP; void main(){ gl_Position = vec4(aP, 0., 1.); }`;
    const fs = `precision mediump float;
uniform vec2 uRes; uniform float uTime; uniform int uCount;
uniform vec4 uBlob[8]; uniform vec3 uCol[8];
uniform float uLens; uniform float uGlow;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1., 0.)), f.x),
             mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), f.x), f.y);
}
float fbm(vec2 p){
  float v = 0., a = .5;
  for (int i = 0; i < 3; i++){ v += a * noise(p); p *= 2.13; a *= .5; }
  return v;
}
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 cc = uv - .5;
  cc.x *= uRes.x / uRes.y;
  float r2 = dot(cc, cc);
  vec2 luv = .5 + (uv - .5) * (1. + uLens * r2); // lens: center bulges
  vec2 px = luv * uRes;
  // global molten flow: one big, slow domain warp shared by everything (lava, not wiggle)
  vec2 flow = vec2(
    fbm(px * .0018 + uTime * .016),
    fbm(px * .0018 - uTime * .013 + 41.7)
  ) - .5;
  px += flow * 130.;
  vec3 col = vec3(0.);
  float field = 0.;
  for (int i = 0; i < 8; i++){
    if (i < uCount){
      vec2 bp = uBlob[i].xy;
      float rad = uBlob[i].z;
      float env = uBlob[i].w;
      // per-blob turbulence: lower frequency, slower = smooth folding
      vec2 q = px + vec2(
        fbm(px * .0035 + uTime * .025 + float(i) * 7.31) - .5,
        fbm(px * .0035 - uTime * .021 + float(i) * 3.77) - .5
      ) * rad * 1.25;
      float d = length(q - bp) / rad;
      // visible floor: even a silent blob keeps .55 presence
      float f = smoothstep(1.3, .12, d) * (.55 + .45 * env);
      // gradient fill: bright warm core -> deep edge
      vec3 g = mix(uCol[i] * 1.45, uCol[i] * .45, clamp(d, 0., 1.));
      col += g * f;
      field += f;
    }
  }
  col += col * uGlow * smoothstep(.5, 1.8, field);       // glow
  col *= 1. - .3 * smoothstep(.35, .95, r2 * 2.2);       // soft lens-edge falloff
  gl_FragColor = vec4(col, clamp(field * 1.2, 0., 1.));
}`;
    function sh(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      return s;
    }
    glProg = gl.createProgram();
    gl.attachShader(glProg, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(glProg, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(glProg);
    if (!gl.getProgramParameter(glProg, gl.LINK_STATUS)) { gl = false; return gl; }
    gl.useProgram(glProg);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const aP = gl.getAttribLocation(glProg, 'aP');
    gl.enableVertexAttribArray(aP);
    gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
    glLoc = {
      res: gl.getUniformLocation(glProg, 'uRes'),
      time: gl.getUniformLocation(glProg, 'uTime'),
      count: gl.getUniformLocation(glProg, 'uCount'),
      blob: gl.getUniformLocation(glProg, 'uBlob'),
      col: gl.getUniformLocation(glProg, 'uCol'),
      lens: gl.getUniformLocation(glProg, 'uLens'),
      glow: gl.getUniformLocation(glProg, 'uGlow'),
    };
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    return gl;
  }

  function renderDream() {
    if (initDreamGL() === false) { drawAmbient('ambient2'); return; } // fallback: 2d lobes
    const t = performance.now() / 1000;
    // half-res backing store = cheap + naturally soft
    const w = Math.floor(glCanvas.clientWidth * 0.5);
    const h = Math.floor(glCanvas.clientHeight * 0.5);
    if (glCanvas.width !== w || glCanvas.height !== h) {
      glCanvas.width = w;
      glCanvas.height = h;
      gl.viewport(0, 0, w, h);
    }
    const scale = w / canvas.clientWidth;
    const items = scenes.ambient2.items.slice(0, 8);
    const blob = new Float32Array(32);
    const col = new Float32Array(24);
    items.forEach((v, i) => {
      const pos = ambientVoicePos(v, t);
      blob[i * 4] = pos.x * scale;
      blob[i * 4 + 1] = h - pos.y * scale; // gl y-flip
      // slow breathing + eased envelope; floor at 0.75x so blobs never vanish
      const breath = 0.95 + 0.25 * Math.sin(t * 0.09 + v.driftPhase * 2.1);
      blob[i * 4 + 2] = v.baseR * (breath + v.envSmooth * 0.55) * scale * 1.7;
      blob[i * 4 + 3] = v.envSmooth;
      const rgb = hueToRgb(v.hue);
      col.set(rgb, i * 3);
    });
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(glLoc.res, w, h);
    gl.uniform1f(glLoc.time, t);
    gl.uniform1i(glLoc.count, items.length);
    gl.uniform4fv(glLoc.blob, blob);
    gl.uniform3fv(glLoc.col, col);
    gl.uniform1f(glLoc.lens, DREAM_LENS);
    gl.uniform1f(glLoc.glow, DREAM_GLOW);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // ---------- THE WORLD: time of day + weather, breathing through every engine ----------
  const WEATHERS = {
    clear:    { dens: 1,    dust: 0,    wow: 1,    haze: 0,    mut: 1 },
    breeze:   { dens: 1.1,  dust: 0.08, wow: 1.25, haze: 0.03, mut: 1.1 },
    overcast: { dens: 0.85, dust: 0.15, wow: 1.1,  haze: 0.12, mut: 0.8 },
    rain:     { dens: 1.25, dust: 0.3,  wow: 1.4,  haze: 0.18, mut: 1.3 },
  };
  const WEATHER_LINES = {
    clear: 'the sky clears',
    breeze: 'a light wind picks up',
    overcast: 'clouds gather low',
    rain: 'a front of rain moves in',
  };
  const DAY_SEGMENTS = [
    [5, 'dawn', 'the sun rises somewhere'],
    [7, 'morning', 'morning settles over everything'],
    [11, 'noon', 'high noon, shadows shortest'],
    [13, 'afternoon', 'the afternoon stretches out'],
    [17, 'dusk', 'the light is getting long'],
    [19, 'evening', 'evening comes quietly'],
    [22, 'night', 'night settles in'],
  ];

  const WORLD = {
    dayLen: 3600,                       // one full day = 1 hour of listening
    phase: Math.random(),               // wake up at a random time of day
    weather: 'clear',
    prevWeather: 'clear',
    weatherStart: 0,
    nextWeatherAt: performance.now() / 1000 + 120 + Math.random() * 240,
    segment: '',
  };
  // live modifiers every engine reads (WX to avoid clashing with local W=width vars)
  const WX = { dens: 1, dust: 0, wow: 1, hazeAdd: 0, mut: 1, night: 0 };

  let lastLogAt = 0;
  function logEvent(text) {
    const now = performance.now() / 1000;
    if (now - lastLogAt < 4) return;
    lastLogAt = now;
    const box = document.getElementById('eventlog');
    const line = document.createElement('div');
    line.className = 'evline';
    line.textContent = text;
    box.appendChild(line);
    while (box.children.length > 5) box.removeChild(box.firstChild);
    [...box.children].forEach((el, i) => {
      el.style.opacity = 0.25 + 0.75 * ((i + 1) / box.children.length);
    });
    setTimeout(() => { line.style.opacity = 0; }, 45000);
    setTimeout(() => { if (line.parentNode) line.parentNode.removeChild(line); }, 60000);
  }

  function daySegment(hour) {
    let seg = DAY_SEGMENTS[DAY_SEGMENTS.length - 1];
    for (const s of DAY_SEGMENTS) if (hour >= s[0]) seg = s;
    if (hour < DAY_SEGMENTS[0][0]) seg = DAY_SEGMENTS[DAY_SEGMENTS.length - 1];
    return seg;
  }

  function stepWorld(dt) {
    const t = performance.now() / 1000;
    WORLD.phase = (WORLD.phase + dt / WORLD.dayLen) % 1;
    const hour = WORLD.phase * 24;
    const dayness = 0.5 - 0.5 * Math.cos(WORLD.phase * Math.PI * 2);

    // weather fronts pass every 2-6 minutes, crossfading over ~30s
    if (t >= WORLD.nextWeatherAt) {
      const options = Object.keys(WEATHERS).filter(w => w !== WORLD.weather);
      WORLD.prevWeather = WORLD.weather;
      WORLD.weather = options[Math.floor(Math.random() * options.length)];
      WORLD.weatherStart = t;
      WORLD.nextWeatherAt = t + 120 + Math.random() * 240;
      logEvent(WEATHER_LINES[WORLD.weather]);
    }
    const mix = Math.min(1, (t - WORLD.weatherStart) / 30);
    const a = WEATHERS[WORLD.prevWeather], b = WEATHERS[WORLD.weather];
    const lerp = (x, y) => x + (y - x) * mix;
    WX.dens = lerp(a.dens, b.dens);
    WX.dust = lerp(a.dust, b.dust);
    WX.wow = lerp(a.wow, b.wow);
    WX.mut = lerp(a.mut, b.mut);
    WX.night = 1 - dayness;
    WX.hazeAdd = lerp(a.haze, b.haze) + WX.night * 0.12;

    const seg = daySegment(hour);
    if (seg[1] !== WORLD.segment) {
      WORLD.segment = seg[1];
      logEvent(seg[2]);
    }
    document.getElementById('world').textContent = `${seg[1]} · ${WORLD.weather}`;

    // field recordings follow the weather
    if (audioCtx && fieldMaster) {
      fieldMaster.gain.setTargetAtTime(S.field * 0.35, audioCtx.currentTime, 0.5);
      const bedAge = fieldBed ? performance.now() / 1000 - fieldBed.bornAt : 0;
      if (S.field > 0.02 && !fieldLoading &&
          (!fieldBed || fieldWeather !== WORLD.weather || bedAge > 210)) {
        loadFieldBed(WORLD.weather); // long loops rotate every ~3.5 min even in steady weather
      }
    }
  }

  // ---------- field recordings: radio aporee (mirrored on archive.org) ----------
  const FIELD_TERMS = {
    clear: 'birds morning',
    breeze: 'wind trees',
    overcast: 'distant ambience',
    rain: 'rain',
  };

  async function fetchFieldFor(weather) {
    try {
      const q = encodeURIComponent(`collection:radio-aporee-maps AND (${FIELD_TERMS[weather]})`);
      const url = `https://archive.org/advancedsearch.php?q=${q}&fl[]=identifier&fl[]=title&rows=100&output=json`;
      const js = await (await fetch(url)).json();
      const docs = js.response.docs;
      if (!docs || !docs.length) return null;
      const pick = docs[Math.floor(Math.random() * docs.length)];
      const meta = await (await fetch(`https://archive.org/metadata/${pick.identifier}`)).json();
      const f = (meta.files || []).find(x => /\.mp3$/i.test(x.name)) || (meta.files || []).find(x => /\.ogg$/i.test(x.name));
      if (!f) return null;
      const audioUrl = `https://archive.org/download/${pick.identifier}/${encodeURIComponent(f.name)}`;
      const arr = await (await fetch(audioUrl)).arrayBuffer();
      const decoded = await audioCtx.decodeAudioData(arr);
      return { decoded, title: String(pick.title || pick.identifier) };
    } catch (e) {
      return null;
    }
  }

  async function loadFieldBed(weather) {
    fieldLoading = true;
    fieldWeather = weather;
    const r = await fetchFieldFor(weather);
    fieldLoading = false;
    if (!r || !audioCtx) return;
    if (fieldWeather !== WORLD.weather) return; // weather moved on while downloading
    // cap at 90s, make seamless, fade the old bed away
    let buf = r.decoded;
    if (buf.duration > 90) {
      const rate = buf.sampleRate;
      const short = audioCtx.createBuffer(buf.numberOfChannels, rate * 90, rate);
      for (let c = 0; c < buf.numberOfChannels; c++) {
        short.copyToChannel(buf.getChannelData(c).subarray(0, rate * 90), c);
      }
      buf = short;
    }
    // level-match: field recordings vary wildly, normalize to a gentle bed level
    let sum = 0;
    const d0 = buf.getChannelData(0);
    for (let i = 0; i < d0.length; i += 8) sum += d0[i] * d0[i];
    const rms = Math.sqrt(sum / (d0.length / 8)) || 0.01;
    const level = Math.max(0.2, Math.min(6, 0.13 / rms));

    const loopBuf = makeLoopableBuffer(buf, 3); // 3s loop-seam crossfade: no audible wrap
    const ta = audioCtx.currentTime;
    if (fieldBed) {
      const old = fieldBed;
      old.g.gain.setTargetAtTime(0, ta, 12); // old place recedes over ~30s
      setTimeout(() => { try { old.src.stop(); old.src.disconnect(); old.g.disconnect(); } catch (e) {} }, 50000);
    }
    const src = audioCtx.createBufferSource();
    src.buffer = loopBuf;
    src.loop = true;
    src.loopStart = 0;
    src.loopEnd = loopBuf._loopEnd;
    const g = audioCtx.createGain();
    g.gain.value = 0;
    g.gain.setTargetAtTime(level, ta, 14); // new place arrives over ~40s, overlapping the old
    src.connect(g).connect(fieldMaster);
    src.start();
    fieldBed = { src, g, bornAt: performance.now() / 1000 };
    logEvent('somewhere: ' + r.title.toLowerCase().slice(0, 52));
  }

  // ---------- global fx: haze veil, heartbeat + sidechain breathing ----------
  let hbNext = 0;
  let hazePhase = 0;
  let hazeHalf = 120 + (Math.random() * 60 - 30); // one veil swing: ~2min +/- 30s

  function thump(when, lvl) {
    if (muted) return;
    noteSoundStart();
    const o = audioCtx.createOscillator();
    o.frequency.setValueAtTime(82, when);
    o.frequency.exponentialRampToValueAtTime(46, when + 0.07);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(0.5 * lvl, when + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, when + 0.22);
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 120;
    o.connect(g).connect(lp).connect(masterGain);
    o.start(when);
    o.stop(when + 0.3);
  }

  function stepGlobalFx(dt) {
    if (!audioCtx) return;
    const ta = audioCtx.currentTime;
    // haze: the veil drifts open and shut veeery slowly - each swing ~2min (+/-30s)
    const prevPhase = hazePhase;
    hazePhase += dt * Math.PI / hazeHalf;
    if (hazePhase >= Math.PI * 2) hazePhase -= Math.PI * 2;
    // new pace for each half-swing (rise and fall get their own duration)
    if ((prevPhase < Math.PI) !== (hazePhase < Math.PI)) {
      hazeHalf = 120 + (Math.random() * 60 - 30);
      if (S.haze > 0.15) logEvent(hazePhase < Math.PI ? 'the veil is opening' : 'the veil settles back');
    }
    const open = (1 - Math.cos(hazePhase)) / 2; // eased 0 -> 1 -> 0
    const amt = Math.min(1, S.haze * (1 - 0.7 * open) + WX.hazeAdd);
    hazeLP.frequency.setTargetAtTime(18000 * Math.pow(600 / 18000, amt), ta, 0.4);
    hazeVerbSend.gain.setTargetAtTime(amt * 0.5, ta, 0.4);
    hazeOut.gain.setTargetAtTime(1 - amt * 0.22, ta, 0.4);

    // heartbeat: felt not heard; ambient family ducks ~10% around each beat
    if (S.hbLevel > 0) {
      const beat = 60 / S.rhyBpm;
      if (!hbNext || hbNext < ta - 0.5) hbNext = ta + 0.1;
      while (hbNext < ta + 0.15) {
        thump(hbNext, S.hbLevel);
        scBus.gain.setTargetAtTime(1 - 0.12 * S.hbLevel, hbNext, 0.03);
        scBus.gain.setTargetAtTime(1, hbNext + 0.1, 0.15);
        hbNext += beat;
      }
    } else {
      hbNext = 0;
    }
  }

  // ---------- shared loop ----------
  function stepRipples(sc, dt) {
    for (let i = sc.ripples.length - 1; i >= 0; i--) {
      const rp = sc.ripples[i];
      rp.r += (rp.maxR - rp.r) * dt * 6;
      rp.a -= dt * 1.4;
      if (rp.a <= 0) sc.ripples.splice(i, 1);
    }
  }

  function drawRipples(sc) {
    for (const rp of sc.ripples) {
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
      ctx.strokeStyle = `hsla(${rp.hue}, 85%, 65%, ${rp.a})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);

  // simulation runs on a timer so sound continues when the page is hidden
  // (rAF pauses in background browser tabs; setInterval keeps ticking)
  let lastStep = performance.now();
  function tick() {
    const now = performance.now();
    let remaining = Math.min((now - lastStep) / 1000, 2); // catch up at most 2s
    lastStep = now;
    while (remaining > 0) {
      const dt = Math.min(remaining, 0.033);
      stepBalls(dt);
      stepPendulums(dt);
      stepShape(dt);
      stepAmbient(dt);
      stepDisint(dt);
      stepRhythm(dt);
      stepWorld(dt);
      stepGlobalFx(dt);
      for (const k in scenes) stepRipples(scenes[k], dt);
      remaining -= dt;
    }
  }
  setInterval(tick, 33);

  function loop() {
    const W = canvas.clientWidth, H = canvas.clientHeight;
    const sc = scenes[activeTab];

    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = '#2a2f3a';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, W - 2, H - 2);
    drawRipples(sc);
    const glEl = document.getElementById('glstage');
    glEl.style.display = activeTab === 'ambient2' ? 'block' : 'none';
    if (activeTab === 'balls') drawBalls();
    else if (activeTab === 'pendulum') drawPendulums();
    else if (activeTab === 'shape') drawShape();
    else if (activeTab === 'ambient') drawAmbient('ambient');
    else if (activeTab === 'disint') drawDisint();
    else if (activeTab === 'rhythm') drawRhythm();
    else renderDream();

    requestAnimationFrame(loop);
  }

  // ---------- input ----------
  canvas.addEventListener('pointerdown', e => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const sc = scenes[activeTab];
    const t = performance.now() / 1000;

    // pendulum mute toggles (right side) take priority
    if (activeTab === 'pendulum') {
      for (let i = 0; i < sc.items.length; i++) {
        const tp = pendulumTogglePos(i);
        if (Math.hypot(x - tp.x, y - tp.y) <= tp.r + 6) {
          sc.items[i].muted = !sc.items[i].muted;
          return;
        }
      }
    }
    const sv = activeTab === 'shape' ? shapeView(t) : null;
    for (let i = sc.items.length - 1; i >= 0; i--) {
      const it = sc.items[i];
      let hx, hy, hr;
      if (activeTab === 'balls') { hx = it.x; hy = it.y; hr = it.r; }
      else if (activeTab === 'pendulum') {
        const pos = pendulumBobPos(it, it.theta);
        hx = pos.x; hy = pos.y; hr = it.bobR;
      } else if (activeTab === 'rhythm') {
        const c = rhythmKitCenter(i, sc.items.length);
        const maxR = Math.min(canvas.clientWidth, canvas.clientHeight) * (0.09 + 2 * 0.045);
        if (Math.hypot(x - c.x, y - c.y) <= maxR + 12) {
          sc.items.splice(i, 1);
          updateCount();
          updateHint();
          break;
        }
        continue;
      } else if (activeTab === 'disint') {
        // ring hit: tap anywhere on the loop's circle
        const R = Math.min(canvas.clientWidth, canvas.clientHeight) * (0.14 + i * 0.055);
        const dist = Math.hypot(x - canvas.clientWidth / 2, y - canvas.clientHeight / 2);
        if (Math.abs(dist - R) <= 15) {
          killDisintLoop(it);
          sc.items.splice(i, 1);
          updateCount();
          updateHint();
          break;
        }
        continue;
      } else if (activeTab === 'shape') {
        const pos = shapeDotPos(it, sv);
        hx = pos.x; hy = pos.y; hr = it.dotR * pos.persp;
      } else {
        const pos = ambientVoicePos(it, t);
        hx = pos.x; hy = pos.y; hr = it.baseR;
      }
      if (Math.hypot(x - hx, y - hy) <= hr) {
        if (activeTab.startsWith('ambient')) killVoice(it);
        sc.items.splice(i, 1);
        sc.ripples.push({ x: hx, y: hy, r: hr * 0.4, maxR: hr * 1.8, a: 0.8, hue: it.hue });
        updateCount();
        updateHint();
        break;
      }
    }
  });

  recBtn.addEventListener('pointerdown', e => { e.preventDefault(); startRecording(); });
  window.addEventListener('pointerup', stopRecording);
  window.addEventListener('pointercancel', stopRecording);

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); startRecording(); }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space') { e.preventDefault(); stopRecording(); }
  });

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
      updateCount();
      updateHint();
      renderKnobs();
    });
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    if (activeTab.startsWith('ambient')) scenes[activeTab].items.forEach(killVoice);
    if (activeTab === 'disint') scenes.disint.items.forEach(killDisintLoop);
    scenes[activeTab].items.length = 0;
    scenes[activeTab].ripples.length = 0;
    updateCount();
    updateHint();
  });

  document.getElementById('muteBtn').addEventListener('click', function () {
    muted = !muted;
    this.textContent = muted ? 'Unmute' : 'Mute';
  });

  document.getElementById('sessionBtn').addEventListener('click', toggleSessionRecording);

  function stopFreezeBed() {
    if (!fzBed) return;
    const ta = audioCtx.currentTime;
    const bed = fzBed;
    fzBed = null;
    bed.g.gain.setTargetAtTime(0, ta, 0.6);
    setTimeout(() => {
      try { bed.src.stop(); bed.lfo.stop(); } catch (e) {}
      try { bed.src.disconnect(); bed.g.disconnect(); bed.lp.disconnect(); } catch (e) {}
    }, 3000);
  }

  document.getElementById('freezeBtn').addEventListener('click', function () {
    ensureAudio();
    frozen = !frozen;
    this.classList.toggle('fx-on', frozen);
    logEvent(frozen ? 'this moment is being frozen' : 'the frozen moment dissolves');
    if (frozen) {
      // capture the next ~3 seconds of the mix, then loop it quietly as a bed
      this.textContent = 'Freezing…';
      const chunks2 = [];
      const mime = bestMime();
      fzRec = new MediaRecorder(fzDest.stream, mime ? { mimeType: mime } : undefined);
      fzRec.ondataavailable = e => { if (e.data.size) chunks2.push(e.data); };
      fzRec.onstop = async () => {
        document.getElementById('freezeBtn').textContent = 'Freeze';
        if (!frozen) return; // cancelled while capturing
        try {
          const arr = await new Blob(chunks2, { type: fzRec.mimeType }).arrayBuffer();
          const decoded = await audioCtx.decodeAudioData(arr);
          const loopBuf = makeLoopableBuffer(decoded);
          const src = audioCtx.createBufferSource();
          src.buffer = loopBuf;
          src.loop = true;
          src.loopStart = 0;
          src.loopEnd = loopBuf._loopEnd;
          const lfo = audioCtx.createOscillator();
          lfo.frequency.value = 0.3;
          const lfoG = audioCtx.createGain();
          lfoG.gain.value = 0.004; // gentle wow on the frozen moment
          lfo.connect(lfoG).connect(src.playbackRate);
          lfo.start();
          const lp = audioCtx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.value = 3200;
          const g = audioCtx.createGain();
          g.gain.value = 0;
          const ta = audioCtx.currentTime;
          g.gain.setTargetAtTime(0.35, ta, 1.2); // bed drifts in, capped low
          src.connect(lp).connect(g).connect(hazeLP);
          src.start();
          fzBed = { src, g, lp, lfo };
        } catch (e) {
          frozen = false;
          document.getElementById('freezeBtn').classList.remove('fx-on');
        }
      };
      fzRec.start();
      setTimeout(() => { if (fzRec && fzRec.state !== 'inactive') fzRec.stop(); }, 3000);
    } else {
      this.textContent = 'Freeze';
      if (fzRec && fzRec.state !== 'inactive') fzRec.stop();
      stopFreezeBed();
    }
  });

  document.getElementById('hazeSlider').addEventListener('input', function () {
    S.haze = parseFloat(this.value);
    ensureAudio();
  });

  document.getElementById('fieldSlider').addEventListener('input', function () {
    S.field = parseFloat(this.value);
    ensureAudio();
  });

  // ---------- go ----------
  resize();
  updateHint();
  renderKnobs();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
